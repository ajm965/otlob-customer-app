name: otlob_customer_app
description: Otlob customer Flutter application foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.9.0
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  build_runner: ^2.15.1
  json_serializable: 6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/fonts/
    - assets/translations/
